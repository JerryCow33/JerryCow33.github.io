<style>:root{--size :100px;}.filtertabs{display :flex;align-items :center;justify-content :center;gap :10px;margin-bottom :var(--size);& .filtertab{padding :10px;background-color :var(--jour);border-radius :5px;min-width :100px;text-align :center;margin-right :0px !important;}& input[type="radio"]{display :none;&:checked + .filtertab{background-color :var(--jour-texte);color :var(--jour);}}&:has(#filter_all:checked){& + .container_losange > .gallery_losange > div:nth-child(5n + 4){grid-column :2 / span 2;}}&:has(#filter_kierm:checked){& + .container_losange > .gallery_losange > div:nth-child(5n + 4 of .kierm){grid-column :2 / span 2;}& + .container_losange > .gallery_losange > div:not(.kierm){display :none;}}&:has(#filter_fehor:checked){& + .container_losange > .gallery_losange > div:nth-child(5n + 4 of .fehor){grid-column :2 / span 2;}& + .container_losange > .gallery_losange > div:not(.fehor){display :none;}}&:has(#filter_averos:checked){& + .container_losange > .gallery_losange > div:nth-child(5n + 4 of .averos){grid-column :2 / span 2;}& + .container_losange > .gallery_losange > div:not(.averos){display :none;}}&:has(#filter_vagabonds:checked){& + .container_losange > .gallery_losange > div:nth-child(5n + 4 of .vagabonds){grid-column :2 / span 2;}& + .container_losange > .gallery_losange > div:not(.vagabonds){display :none;}}}.container_losange{display :flex;align-items :center;justify-content :center;margin-top :calc(var(--size)/2);}.gallery_losange{display :grid;grid-template-columns :repeat(6, var(--size));grid-auto-rows :var(--size);margin-bottom :var(--size);place-items :start center;gap :5px;&:has(:hover) div:not(:hover), &:has(:focus) div:not(:focus){filter :brightness(.5) contrast(.5);}& div{position :relative;overflow :hidden;width :calc(var(--size));height :calc(var(--size));transform :scale(1.4) rotate(45deg);transition :all 0.25s, transform 0.25s, filter 0.75s;grid-column :auto / span 2;border-radius :5px;&:hover, &:focus{transform :scale(2) rotate(45deg);z-index :1;transition :all 0.25s, transform 0.25s, filter 0.25s;}&:focus{outline :1px dashed #000;outline-offset :-5px;}& img{width :calc(var(--size));height :calc(var(--size));transform :scale(1.5) rotate(-45deg);}}}.kierm{border :2px solid var(--kierm);}.fehor{border :2px solid var(--fehor);}.averos{border :2px solid var(--averos);}.vagabonds{border :2px solid var(--vagabonds);}.night-mode{.filtertabs{& .filtertab{background-color :var(--nuit);}}& input[type="radio"]{&:checked + .filtertab{background-color :var(--nuit-texte);color :var(--nuit);}}}</style>
